<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Coach</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#2e7d32,#81c784);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:800px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    color:white;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.chat-box{
    background:rgba(255,255,255,0.1);
    border-radius:15px;
    padding:15px;
    height:350px;
    overflow-y:auto;
}

.message{
    margin:10px 0;
    padding:12px;
    border-radius:10px;
}

.user{
    background:#1b5e20;
    text-align:right;
}

.bot{
    background:#388e3c;
}

.input-area{
    display:flex;
    margin-top:15px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
}

button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#1b5e20;
    color:white;
    cursor:pointer;
}

.back-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#1b5e20;
    padding:12px;
    border-radius:20px;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">

<h1>🤖 Eco Coach</h1>

<div class="chat-box" id="chatBox">
    <div class="message bot">
        Hello! Ask me about sustainability, water saving, recycling, or energy conservation.
    </div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask an eco question...">
    <button onclick="sendMessage()">Send</button>
</div>

<a href="/dashboard" class="back-btn">
⬅ Back to Dashboard
</a>

</div>

<script>

function sendMessage(){

    let input = document.getElementById("userInput");
    let text = input.value.trim();

    if(text === ""){
        return;
    }

    let chatBox = document.getElementById("chatBox");

    chatBox.innerHTML += `
        <div class="message user">${text}</div>
    `;

    let reply = "Try reducing waste, saving water, and using renewable energy.";

    let lower = text.toLowerCase();

    if(lower.includes("water")){
        reply = "💧 Fix leaks, take shorter showers, and turn off taps when not in use.";
    }

    else if(lower.includes("electricity") || lower.includes("energy")){
        reply = "⚡ Switch to LED bulbs and unplug devices when not needed.";
    }

    else if(lower.includes("plastic") || lower.includes("recycle")){
        reply = "♻️ Separate recyclable waste and avoid single-use plastics.";
    }

    else if(lower.includes("carbon")){
        reply = "🌍 Use public transport, cycle, walk, and reduce energy consumption.";
    }

    else if(lower.includes("tree")){
        reply = "🌳 Plant native trees and support urban green spaces.";
    }

    setTimeout(() => {
        chatBox.innerHTML += `
            <div class="message bot">${reply}</div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 500);

    input.value = "";
}

</script>

</body>
</html>
