<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#2e7d32,#81c784);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:20px;
    width:100%;
    max-width:500px;
    color:white;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:600;
}

input,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#1b5e20;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0d3b12;
}

.back-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="container">

<h1>🌍 Sustainability Tracker</h1>

<form action="/calculate" method="POST">

<label>💧 Water Usage (Liters)</label>
<input type="number" name="water" required>

<label>⚡ Electricity Usage (kWh)</label>
<input type="number" name="electricity" required>

<label>♻️ Waste Generated (kg)</label>
<input type="number" name="waste" required>

<label>🚲 Transport Mode</label>
<select name="transport">
    <option value="Walk">Walk</option>
    <option value="Bicycle">Bicycle</option>
    <option value="Bus">Bus</option>
    <option value="Car">Car</option>
</select>

<button type="submit">
📊 Calculate Sustainability Score
</button>

</form>

<a href="/dashboard" class="back-btn">
⬅ Back to Dashboard
</a>

</div>

</body>
</html>
